name: CI-CD PIPELINE - TEST, BUILD AND DEPLOY

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # STAGE 1: Quality Assurance & Code Validation
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Portfolio_Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Portfolio_Backend

      - name: Run tests
        run: npm test
        working-directory: Portfolio_Backend

      - name: Run ESLint
        run: npm run lint
        working-directory: Portfolio_Backend

      - name: Run security audit
        run: npm audit --audit-level=high
        working-directory: Portfolio_Backend  

  # STAGE 2: Build & Package Docker Container (Only runs if Stage 1 passes)
  docker:
    needs: test # <-- This guarantees the pipeline halts if tests fail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Portfolio_Backend
          file: ./Portfolio_Backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STAGE 3: Notify Render to Deploy the New Image (Only runs if Stage 2 passes)
  deploy:
    needs: docker # <-- This guarantees Render isn't notified until the fresh image is fully uploaded
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"
