name: Higgs Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # ⚠️ Add this line to tell the cache runner where your lock file lives:
          cache-dependency-path: package-lock.json

          
      # ⚠️ Step into backend directory to install packages
      - name: Install dependencies
        run: npm ci
        working-directory: Portfolio_Backend

      # ⚠️ Step into backend directory to run tests
      - name: Run tests
        run: npm test
        working-directory: Portfolio_Backend
